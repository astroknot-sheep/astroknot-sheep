name: Refresh open-source profile
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_pr_dashboard.py'
      - '.github/workflows/update-stats.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: astroknot-sheep
        run: python scripts/generate_pr_dashboard.py
      - name: Publish charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/field-*.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update field notes'
            git push
          fi
